<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#198754">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Athletica</title>
    
    <meta name="description" content="Athletica - Free online stopwatch with laps, timing, and analytics. Perfect for workouts, cooking, and timing events.">
    <meta name="keywords" content="athletica, stopwatch, online stopwatch, timer, lap counter, free stopwatch, workout timer">
    <meta name="author" content="Lemuel Owusu-Ansah">
    <meta name="robots" content="index, follow">
    
    <meta property="og:title" content="Athletica - Stopwatch">
    <meta property="og:description" content="Free online stopwatch with laps and timing analytics.">
    <meta property="og:type" content="website">
    
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Athletica - Stopwatch">
    <meta name="twitter:description" content="Free online stopwatch with laps.">
    
    <link rel="canonical" href="https://your-domain.com/athletica">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-xl-6 col-lg-8 col-md-10 col-12">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-transparent py-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="mb-0 fw-normal">
                                <i class="bi bi-stopwatch text-primary"></i> Athletica
                            </h5>
                            <div class="d-flex gap-2">
                                <button class="btn btn-outline-secondary btn-sm" id="fullscreenBtn" aria-label="Full screen">
                                    <i class="bi bi-arrows-fullscreen"></i>
                                </button>
                                <button class="btn btn-outline-secondary btn-sm" id="soundToggleBtn" aria-label="Toggle sound">
                                    <i class="bi bi-volume-up-fill"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-4">
                        <div class="time-display" id="timeDisplay">00:00:00.000</div>
                        
                        <div class="d-flex justify-content-center gap-3 flex-wrap mb-4">
                            <button class="btn-start" id="startBtn">
                                <i class="bi bi-play-fill"></i> Start
                            </button>
                            <button class="btn-lap" id="lapBtn" disabled>
                                <i class="bi bi-flag-fill"></i> Lap <span id="lapCountBadge" class="badge bg-light text-dark ms-1">0</span>
                            </button>
                            <button class="btn-reset" id="resetBtn" disabled>
                                <i class="bi bi-arrow-counterclockwise"></i> Reset
                            </button>
                        </div>
                        
                        <div class="row g-3 mb-4">
                            <div class="col-4 text-center">
                                <small class="text-muted d-block">Laps</small>
                                <span class="fw-bold" id="lapCount">0</span>
                            </div>
                            <div class="col-4 text-center">
                                <small class="text-muted d-block">Fastest</small>
                                <span class="fw-bold text-success" id="fastestLap">--</span>
                            </div>
                            <div class="col-4 text-center">
                                <small class="text-muted d-block">Slowest</small>
                                <span class="fw-bold text-danger" id="slowestLap">--</span>
                            </div>
                        </div>
                        
                        <div class="lap-table-container" id="lapContainer">
                            <table class="table table-striped table-hover lap-table">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Time</th>
                                        <th>Difference</th>
                                    </tr>
                                </thead>
                                <tbody id="lapBody">
                                </tbody>
                            </table>
                        </div>
                        
                        <div class="mt-3 d-flex gap-2 flex-wrap">
                            <button class="btn btn-outline-secondary btn-sm flex-fill" id="copyLapsBtn" disabled>
                                <i class="bi bi-clipboard"></i> Copy Laps
                            </button>
                            <button class="btn btn-outline-secondary btn-sm flex-fill" id="shareResultsBtn" disabled>
                                <i class="bi bi-share"></i> Share Results
                            </button>
                        </div>
                        
                        <div class="shortcuts-hint mt-3">
                            <small>⌨️ Space: Start/Stop | L: Lap | R: Reset</small>
                        </div>
                    </div>
                    <div class="card-footer text-center text-muted small py-2">
                        <span><i class="bi bi-play-circle text-success" style="font-size: 0.5rem;"></i> Space = Start/Stop</span>
                        <span class="mx-2">|</span>
                        <span><i class="bi bi-flag text-warning" style="font-size: 0.5rem;"></i> L = Lap</span>
                        <span class="mx-2">|</span>
                        <span><i class="bi bi-arrow-counterclockwise text-secondary" style="font-size: 0.5rem;"></i> R = Reset</span>
                        <span class="mx-2">|</span>
                        <span>Athletica · Apps by Lemuel Owusu-Ansah</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/stopwatch.js"></script>
</body>
</html>
